app-id: io.github.simarsinghrayat.GitHubWeb
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: github-web
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=/tmp
modules:
  - name: github-web
    buildsystem: simple
    build-commands:
      - install -d /app/lib/github-web /app/bin /app/share/applications /app/share/metainfo /app/share/icons/hicolor/scalable/apps
      - cp -r src package.json resources /app/lib/github-web/
      - unzip -q electron-linux-x64.zip -d /app/lib/github-web/electron
      - install -Dm755 bin/github-web /app/bin/github-web
      - install -Dm644 flatpak/io.github.simarsinghrayat.GitHubWeb.desktop /app/share/applications/io.github.simarsinghrayat.GitHubWeb.desktop
      - install -Dm644 flatpak/io.github.simarsinghrayat.GitHubWeb.metainfo.xml /app/share/metainfo/io.github.simarsinghrayat.GitHubWeb.metainfo.xml
      - install -Dm644 resources/github-web.png /app/share/icons/hicolor/scalable/apps/io.github.simarsinghrayat.GitHubWeb.png
      - install -Dm644 icon/16x16/io.github.simarsinghrayat.GitHubWeb.png /app/share/icons/hicolor/16x16/apps/io.github.simarsinghrayat.GitHubWeb.png
      - install -Dm644 icon/32x32/io.github.simarsinghrayat.GitHubWeb.png /app/share/icons/hicolor/32x32/apps/io.github.simarsinghrayat.GitHubWeb.png
      - install -Dm644 icon/48x48/io.github.simarsinghrayat.GitHubWeb.png /app/share/icons/hicolor/48x48/apps/io.github.simarsinghrayat.GitHubWeb.png
      - install -Dm644 icon/64x64/io.github.simarsinghrayat.GitHubWeb.png /app/share/icons/hicolor/64x64/apps/io.github.simarsinghrayat.GitHubWeb.png
      - install -Dm644 icon/128x128/io.github.simarsinghrayat.GitHubWeb.png /app/share/icons/hicolor/128x128/apps/io.github.simarsinghrayat.GitHubWeb.png
      - install -Dm644 icon/256x256/io.github.simarsinghrayat.GitHubWeb.png /app/share/icons/hicolor/256x256/apps/io.github.simarsinghrayat.GitHubWeb.png
      - install -Dm644 icon/512x512/io.github.simarsinghrayat.GitHubWeb.png /app/share/icons/hicolor/512x512/apps/io.github.simarsinghrayat.GitHubWeb.png
    sources:
      - type: dir
        path: .
      - type: file
        url: https://github.com/electron/electron/releases/download/v43.3.0/electron-v43.3.0-linux-x64.zip
        sha256: f4987e9f045e46b117f0805d6ba4dc524e2abb2c2e33660f175bb39564bd3dae
        dest-filename: electron-linux-x64.zip