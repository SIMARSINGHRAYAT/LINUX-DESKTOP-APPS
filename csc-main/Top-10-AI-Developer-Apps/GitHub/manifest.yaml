app-id: io.github.example.GitHubDesktop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: github-desktop
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-download
modules:
  - name: github-desktop
    buildsystem: simple
    build-commands:
      - install -d /app/lib/github-desktop /app/bin /app/share/applications /app/share/metainfo /app/share/icons/hicolor/scalable/apps
      - cp -r src package.json resources /app/lib/github-desktop/
      - unzip -q electron-linux-x64.zip -d /app/lib/github-desktop/electron
      - printf '#!/bin/sh\nexec /app/lib/github-desktop/electron/electron --no-sandbox /app/lib/github-desktop "$@"\n' > /app/bin/github-desktop
      - chmod 755 /app/bin/github-desktop
      - install -Dm644 flatpak/io.github.example.GitHubDesktop.desktop /app/share/applications/io.github.example.GitHubDesktop.desktop
      - install -Dm644 flatpak/io.github.example.GitHubDesktop.metainfo.xml /app/share/metainfo/io.github.example.GitHubDesktop.metainfo.xml
      - install -Dm644 resources/github-desktop.png /app/share/icons/hicolor/scalable/apps/io.github.example.GitHubDesktop.png
      - install -Dm644 icon/16x16/io.github.example.GitHubDesktop.png /app/share/icons/hicolor/16x16/apps/io.github.example.GitHubDesktop.png
      - install -Dm644 icon/32x32/io.github.example.GitHubDesktop.png /app/share/icons/hicolor/32x32/apps/io.github.example.GitHubDesktop.png
      - install -Dm644 icon/48x48/io.github.example.GitHubDesktop.png /app/share/icons/hicolor/48x48/apps/io.github.example.GitHubDesktop.png
      - install -Dm644 icon/64x64/io.github.example.GitHubDesktop.png /app/share/icons/hicolor/64x64/apps/io.github.example.GitHubDesktop.png
      - install -Dm644 icon/128x128/io.github.example.GitHubDesktop.png /app/share/icons/hicolor/128x128/apps/io.github.example.GitHubDesktop.png
      - install -Dm644 icon/256x256/io.github.example.GitHubDesktop.png /app/share/icons/hicolor/256x256/apps/io.github.example.GitHubDesktop.png
      - install -Dm644 icon/512x512/io.github.example.GitHubDesktop.png /app/share/icons/hicolor/512x512/apps/io.github.example.GitHubDesktop.png
    sources:
      - type: dir
        path: .
      - type: file
        url: https://github.com/electron/electron/releases/download/v43.3.0/electron-v43.3.0-linux-x64.zip
        sha256: f4987e9f045e46b117f0805d6ba4dc524e2abb2c2e33660f175bb39564bd3dae
        dest-filename: electron-linux-x64.zip