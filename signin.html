<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | Linux App Center</title>
    <meta name="description" content="Sign in to the Linux App Center with GitHub." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="signin-page">
    <div id="floating-logos" aria-hidden="true"></div>
    <main class="page-shell signin-shell">
      <section class="signin-panel" aria-labelledby="signin-title">
        <p class="eyebrow">Linux App Center</p>
        <h1 id="signin-title">Sign in to continue</h1>
        <p>Use your GitHub account to unlock the app dashboard.</p>
        <p id="signin-error" class="signin-error" hidden>GitHub sign-in did not complete. Please try again.</p>
        <a class="github-signin-btn" href="./api/auth/github/login">
          <span aria-hidden="true">◉</span>
          Continue with GitHub
        </a>
      </section>
    </main>
    <script src="./script.js"></script>
    <script>
      if (new URLSearchParams(window.location.search).has('auth_error')) {
        document.getElementById('signin-error').hidden = false;
      }
    </script>
  </body>
</html>
